services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - hms_instance_data:/app/instance
      - hms_exports_data:/app/exports
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "backend.celery_config", "worker", "--loglevel=info"]
    volumes:
      - hms_instance_data:/app/instance
      - hms_exports_data:/app/exports
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "backend.celery_config", "beat", "--loglevel=info", "--schedule", "/app/celery/celerybeat-schedule"]
    volumes:
      - hms_instance_data:/app/instance
      - hms_exports_data:/app/exports
      - hms_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hms_redis_data:
  hms_instance_data:
  hms_exports_data:
  hms_celery_data:
