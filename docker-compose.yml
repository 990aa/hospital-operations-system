name: hospital-operations-system

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "true"
      METRICS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["python", "app.py"]
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "false"
      METRICS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["gunicorn", "--config", "gunicorn.conf.py", "app:app"]
    ports:
      - "5000:5000"
    volumes:
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  celery-worker-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      FLASK_DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["celery", "-A", "backend.celery_config", "worker", "--loglevel=info"]
    volumes:
      - ./:/app
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["celery", "-A", "backend.celery_config", "worker", "--loglevel=info"]
    volumes:
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  celery-beat-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      FLASK_DEBUG: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["celery", "-A", "backend.celery_config", "beat", "--loglevel=info", "--schedule", "/app/celery/celerybeat-schedule"]
    volumes:
      - ./:/app
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      CACHE_REDIS_URL: redis://redis:6379/0
      BLOODBANK_DB_PATH: /app/instance/bloodbank.db
    command: ["celery", "-A", "backend.celery_config", "beat", "--loglevel=info", "--schedule", "/app/celery/celerybeat-schedule"]
    volumes:
      - hos_instance_data:/app/instance
      - hos_exports_data:/app/exports
      - hos_celery_data:/app/celery
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hos_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - hos_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  hos_redis_data:
  hos_instance_data:
  hos_exports_data:
  hos_celery_data:
  hos_prometheus_data:
  hos_grafana_data:
