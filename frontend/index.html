<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Plotly.js for Charts -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>
    <div id="app">
        {% raw %}
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-hospital me-2" viewBox="0 0 16 16">
                        <path d="M8.5 5.034v1.1l.953-.55.5.867L9 7l.953.55-.5.866-.953-.55v1.1h-1v-1.1l-.953.55-.5-.866L7 7l-.953-.55.5-.866.953.55v-1.1h1ZM13.25 9a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5ZM13 11.25a.25.25 0 0 1 .25-.25h.5a.25.25 0 0 1 .25.25v.5a.25.25 0 0 1-.25.25h-.5a.25.25 0 0 1-.25-.25v-.5Zm.25 1.75a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5Zm-11-4a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5A.25.25 0 0 0 3 9.75v-.5A.25.25 0 0 0 2.75 9h-.5Zm0 2a.25.25 0 0 0-.25.25v.5c0 .138.112.25.25.25h.5a.25.25 0 0 0 .25-.25v-.5a.25.25 0 0 0-.25-.25h-.5ZM2 13.25a.25.25 0 0 1 .25-.25h.5a.25.25 0 0 1 .25.25v.5a.25.25 0 0 1-.25.25h-.5a.25.25 0 0 1-.25-.25v-.5Z"/>
                        <path d="M5 1a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1a1 1 0 0 1 1 1v4h3a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3V3a1 1 0 0 1 1-1V1Zm2 14h2v-3H7v3Zm3 0h1V3H5v12h1v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3Zm0-14H6v1h4V1Zm2 7v7h3V8h-3Zm-8 7V8H1v7h3Z"/>
                    </svg>
                    <span class="fw-bold">Hospital Management System</span>
                </a>
                <div v-if="user" class="d-flex align-items-center">
                    <span class="text-white me-3">
                        <span class="badge bg-secondary me-2">{{ getRoleDisplay(user.roles) }}</span>
                        {{ user.name }}
                    </span>
                    <button class="btn btn-outline-light btn-sm" @click="logout">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Alert Messages -->
        <div v-if="message" class="container mt-3">
            <div :class="['alert', messageType == 'error' ? 'alert-danger' : 'alert-success', 'alert-dismissible', 'fade', 'show']" role="alert">
                {{ message }}
                <button type="button" class="btn-close" @click="message = ''"></button>
            </div>
        </div>

        <!-- Login / Register View -->
        <div v-if="!user" class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                            <ul class="nav nav-tabs card-header-tabs border-0">
                                <li class="nav-item">
                                    <a class="nav-link text-white border-0" :class="{active: authMode === 'login', 'bg-secondary': authMode === 'login'}" @click="authMode = 'login'" href="#">Sign In</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link text-white border-0" :class="{active: authMode === 'register', 'bg-secondary': authMode === 'register'}" @click="authMode = 'register'" href="#">Register</a>
                                </li>
                            </ul>
                        </div>
                        <div class="card-body p-4">
                            <form @submit.prevent="authSubmit">
                                <div class="mb-3" v-if="authMode === 'register'">
                                    <label class="form-label fw-semibold">Full Name</label>
                                    <input type="text" v-model="authForm.name" class="form-control" placeholder="John Doe" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Username</label>
                                    <input type="text" v-model="authForm.username" class="form-control" placeholder="username" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Password</label>
                                    <input type="password" v-model="authForm.password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-dark w-100">
                                    {{ authMode === 'login' ? 'Sign In' : 'Create Account' }}
                                </button>
                            </form>
                            <div v-if="authMode === 'login'" class="mt-3 text-center">
                                <small class="text-muted">Default Admin: admin / admin</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Views -->
        <div v-else>
            <!-- Admin Dashboard -->
            <div v-if="hasRole('admin')">
                <admin-dashboard :user="user"></admin-dashboard>
            </div>

            <!-- Doctor Dashboard -->
            <div v-if="hasRole('doctor')">
                <doctor-dashboard :user="user"></doctor-dashboard>
            </div>

            <!-- Patient Dashboard -->
            <div v-if="hasRole('patient')">
                <patient-dashboard :user="user"></patient-dashboard>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer mt-5 py-3 bg-light border-top">
            <div class="container text-center">
            </div>
        </footer>
        {% endraw %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic -->
    <script src="/static/js/app.js"></script>
</body>
</html>
