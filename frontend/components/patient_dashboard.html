        <div class="container">
            <h3>Patient Dashboard</h3>
            <div class="row">
                <div class="col-md-4">
                    <div class="card mb-3">
                        <div class="card-header">Book Appointment</div>
                        <div class="card-body">
                            <form @submit.prevent="bookAppointment">
                                <div class="mb-2">
                                    <label>Department</label>
                                    <select class="form-select" v-model="booking.department_id" @change="fetchDoctors">
                                        <option value="" disabled>Select Department</option>
                                        <option v-for="dept in departments" :value="dept.id">{{ dept.name }}</option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <label>Doctor</label>
                                    <select class="form-select" v-model="booking.doctor_id" :disabled="!booking.department_id">
                                        <option value="" disabled>Select Doctor</option>
                                        <option v-for="doc in availableDoctors" :value="doc.id">{{ doc.name }}</option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <label>Date</label>
                                    <input type="date" class="form-control" v-model="booking.date" required :min="today">
                                </div>
                                <div class="mb-2">
                                    <label>Time</label>
                                    <input type="time" class="form-control" v-model="booking.time" required> 
                                </div>
                                <div class="mb-2">
                                    <label>Reason</label>
                                    <textarea class="form-control" v-model="booking.reason" rows="2"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Book Now</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <h5>My Appointments</h5>
                    <table class="table table-bordered">
                        <thead><tr><th>Doctor</th><th>Date</th><th>Status</th><th>Notes</th></tr></thead>
                        <tbody>
                            <tr v-for="appt in appointments" :key="appt.id">
                                <td>{{ appt.doctor_name }} <br> <span class="badge bg-light text-dark">{{ appt.department }}</span></td>
                                <td>{{ appt.date }} {{ appt.time }}</td>
                                <td><span class="badge" :class="statusBadge(appt.status)">{{ appt.status }}</span></td>
                                <td>{{ appt.notes }}</td>
                            </tr>
                            <tr v-if="appointments.length === 0">
                                <td colspan="4" class="text-center">No appointments found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
