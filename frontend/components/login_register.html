        <div class="d-flex justify-content-center align-items-center vh-100 bg-light">
            <div class="card p-4 shadow" style="width: 400px">
                <h3 class="text-center mb-4">{{ isLogin ? 'Login' : 'Register' }}</h3>
                
                <form @submit.prevent="submitForm">
                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email" v-model="form.email" class="form-control" required placeholder="name@example.com">
                    </div>
                    
                    <div v-if="!isLogin" class="mb-3">
                        <label>Full Name</label>
                        <input type="text" v-model="form.name" class="form-control" required placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" v-model="form.password" class="form-control" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">{{ isLogin ? 'Sign In' : 'Sign Up' }}</button>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <p class="small text-muted" v-if="isLogin">
                        Don't have an account? <a href="#" @click.prevent="isLogin = false">Register</a>
                    </p>
                    <p class="small text-muted" v-else>
                        Already have an account? <a href="#" @click.prevent="isLogin = true">Login</a>
                    </p>
                </div>

                <div v-if="error" class="alert alert-danger mt-3 small">
                    {{ error }}
                </div>
            </div>
        </div>
