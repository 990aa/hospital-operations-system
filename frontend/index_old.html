<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body class="bg-light">
    <div id="app">
        {% raw %}
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">HMS</a>
                <div class="d-flex" v-if="user">
                    <span class="navbar-text text-white me-3">
                        Welcome, {{ user.name }} ({{ user.role }})
                    </span>
                    <button class="btn btn-outline-light btn-sm" @click="logout">Logout</button>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <!-- Alert Messages -->
            <div v-if="message" :class="['alert', messageType == 'error' ? 'alert-danger' : 'alert-success']" role="alert">
                {{ message }}
            </div>

            <!-- Login / Register View -->
            <div v-if="!user">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow-sm">
                            <div class="card-header bg-secondary text-white">
                                <ul class="nav nav-tabs card-header-tabs">
                                    <li class="nav-item">
                                        <a class="nav-link text-white" :class="{active: authMode === 'login'}" @click="authMode = 'login'" href="#">Login</a>
                                    </li>
                                    <!-- Only showing Register for Patients as per requirement -->
                                    <li class="nav-item">
                                        <a class="nav-link text-white" :class="{active: authMode === 'register'}" @click="authMode = 'register'" href="#">Patient Register</a>
                                    </li>
                                </ul>
                            </div>
                            <div class="card-body">
                                <form @submit.prevent="authSubmit">
                                    <div class="mb-3" v-if="authMode === 'register'">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" v-model="authForm.name" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" v-model="authForm.username" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Password</label>
                                        <input type="password" v-model="authForm.password" class="form-control" required>
                                    </div>
                                    <button type="submit" class="btn btn-secondary w-100">{{ authMode === 'login' ? 'Login' : 'Register' }}</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dashboard Views -->
            <div v-else>
                
                <!-- Admin Dashboard -->
                <div v-if="user.role === 'admin'">
                    <admin-dashboard></admin-dashboard>
                </div>

                <!-- Doctor Dashboard -->
                <div v-if="user.role === 'doctor'">
                    <doctor-dashboard :user="user"></doctor-dashboard>
                </div>

                <!-- Patient Dashboard -->
                <div v-if="user.role === 'patient'">
                    <patient-dashboard :user="user"></patient-dashboard>
                </div>

            </div>
        </div>
        {% endraw %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic -->
    <script src="/static/js/app.js"></script>
</body>
</html>
