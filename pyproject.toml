[project]
name = "hospital-operations-system"
version = "0.1.0"
description = "A Hospital Operations System web application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "gunicorn",
    "flask-sqlalchemy",
    "flask-security-too",
    "flask-jwt-extended>=4.7.1",
    "flask-limiter>=3.12",
    "flask-talisman>=1.1.0",
    "flask-smorest>=0.46.2",
    "flask-caching",
    "flask-mail",
    "python-dotenv",
    "pydantic>=2.11.5",
    "bcrypt",
    "werkzeug",
    "email_validator",
    "celery",
    "redis",
    "pandas",
    "bleach>=6.3.0",
    "argon2-cffi>=25.1.0",
    "pymupdf>=1.27.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "factory-boy>=3.3.3",
    "hypothesis>=6.142.4",
    "mutmut>=3.3.1",
]

[tool.pytest.ini_options]
addopts = "--cov=backend --cov=models --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "backend/routes.py",
    "backend/validators.py",
    "backend/ensure_vendors.py",
    "backend/celery_config.py",
]


