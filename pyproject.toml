[project]
name = "hospital-operations-system"
version = "0.1.0"
description = "A Hospital Operations System web application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "gunicorn",
    "flask-sqlalchemy",
    "flask-security-too",
    "flask-caching",
    "flask-mail",
    "python-dotenv",
    "bcrypt",
    "werkzeug",
    "email_validator",
    "celery",
    "redis",
    "pandas",
    "bleach>=6.3.0",
    "argon2-cffi>=25.1.0",
    "pymupdf>=1.27.1",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]


